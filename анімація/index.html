<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Time of Day</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<input type="radio" name="time" id="dusk" checked>
<input type="radio" name="time" id="day">
<input type="radio" name="time" id="sunset">
<input type="radio" name="time" id="night">

<div class="frame">
  <div class="scene">

    <div class="orbit">
      <div class="sun"></div>
    </div>

    <div class="moon"></div>
    <div class="stars"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="city"></div>
   <div class="cat">
  <div class="eyes">
    <span></span>
    <span></span>
  </div>
  <div class="tail"></div>
  <div class="paws"></div>
</div>

  </div>
</div>

<div class="buttons">
  <label for="dusk">Ранок</label>
  <label for="day">День</label>
  <label for="sunset">Захід сонця</label>
  <label for="night">Ніч</label>
</div>

</body>
</html>
